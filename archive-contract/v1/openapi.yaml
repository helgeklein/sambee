openapi: 3.1.0
info:
  title: Archive Operation Contract
  version: 1.0.0
  description: >-
    Versioned lifecycle and scoped-adapter contract for foreground archive
    creation and extraction. Public lifecycle endpoints never accept arbitrary
    filesystem paths or connection identifiers.
paths:
  /archive-executions:
    post:
      operationId: startArchiveExecution
      x-semantic-operation: execution
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Start an archive execution from an immutable plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveExecutionStartRequest'
      responses:
        '201':
          description: Execution started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveExecution'
        '409':
          $ref: '#/components/responses/StaleRevision'
  /archive-executions/{executionId}:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    get:
      operationId: getArchiveExecution
      x-semantic-operation: execution
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Retrieve current execution state and progress
      responses:
        '200':
          description: Current execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveExecution'
  /archive-executions/{executionId}/decisions:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    post:
      operationId: decideArchiveExecution
      x-semantic-operation: execution
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Apply the current pending user decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveExecutionDecisionRequest'
      responses:
        '200':
          description: Decision applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveExecution'
        '409':
          $ref: '#/components/responses/StaleRevision'
  /archive-executions/{executionId}/cancellation:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    post:
      operationId: cancelArchiveExecution
      x-semantic-operation: execution
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Request foreground execution cancellation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveExecutionMutationRequest'
      responses:
        '200':
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveExecution'
        '409':
          $ref: '#/components/responses/StaleRevision'
  /api/browse/{connectionId}/archive/list:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}]
    get:
      operationId: listSmbArchiveDirectory
      x-semantic-operation: inspection
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: List a bounded virtual directory page from an SMB ZIP archive
      security: [{ArchiveUserToken: []}]
      parameters:
        - name: archive_path
          in: query
          required: true
          schema: {type: string, minLength: 1}
        - name: virtual_path
          in: query
          required: false
          schema: {type: string, default: ''}
        - name: cursor
          in: query
          required: false
          schema: {type: [string, 'null']}
        - name: page_size
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Stable archive virtual-directory page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArchiveDirectoryListingV1'}
  /api/viewer/{connectionId}/archive/member:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}]
    get:
      operationId: readArchiveMember
      x-semantic-operation: inspection
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Stream one parser-validated SMB archive member
      security: [{ArchiveUserToken: []}]
      parameters:
        - $ref: '#/components/parameters/ArchivePath'
        - $ref: '#/components/parameters/MemberPath'
        - name: download
          in: query
          required: false
          schema: {type: boolean, default: false}
        - name: view_kind
          in: query
          required: false
          schema: {type: string, enum: [raw, text, image, pdf], default: raw}
        - name: pdf_variant
          in: query
          required: false
          schema: {type: string, enum: [original, normalized], default: original}
        - name: viewport_width
          in: query
          required: false
          schema: {type: integer, minimum: 1}
        - name: viewport_height
          in: query
          required: false
          schema: {type: integer, minimum: 1}
        - name: no_resizing
          in: query
          required: false
          schema: {type: boolean, default: false}
        - name: screen_width
          in: query
          required: false
          schema: {type: integer, minimum: 320, maximum: 16384}
        - name: screen_height
          in: query
          required: false
          schema: {type: integer, minimum: 320, maximum: 16384}
        - name: screen_zoom_percent
          in: query
          required: false
          schema: {type: integer, minimum: 100, maximum: 400, default: 200}
      responses:
        '200':
          description: Decoded archive member bytes
          content:
            application/octet-stream:
              schema: {$ref: '#/components/schemas/ArchiveBinaryStream'}
  /api/viewer/{connectionId}/archive/member/pdf-derivative:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}]
    delete:
      operationId: invalidateArchiveMemberPdfDerivative
      x-semantic-operation: inspection
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Invalidate one SMB archive member PDF derivative
      security: [{ArchiveUserToken: []}]
      parameters:
        - $ref: '#/components/parameters/ArchivePath'
        - $ref: '#/components/parameters/MemberPath'
        - name: screen_width
          in: query
          required: false
          schema: {type: integer, minimum: 320, maximum: 16384}
        - name: screen_height
          in: query
          required: false
          schema: {type: integer, minimum: 320, maximum: 16384}
        - name: screen_zoom_percent
          in: query
          required: false
          schema: {type: integer, minimum: 100, maximum: 400, default: 200}
      responses:
        '204':
          description: PDF derivative invalidated
  /api/archive/operations:
    post:
      operationId: prepareArchiveOperation
      x-semantic-operation: execution
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Prepare a durable archive operation
      security: [{ArchiveUserToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchiveOperationPrepare'}
      responses:
        '201': {$ref: '#/components/responses/ArchiveOperation'}
    get:
      operationId: listArchiveOperations
      x-semantic-operation: execution
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: List the caller's durable archive operations
      security: [{ArchiveUserToken: []}]
      parameters:
        - name: active_only
          in: query
          required: false
          schema: {type: boolean, default: false}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200':
          description: Recent durable archive operations
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ArchiveOperationRead'}
  /api/archive/operations/{operationId}:
    parameters: [{$ref: '#/components/parameters/OperationId'}]
    get:
      operationId: getArchiveOperation
      x-semantic-operation: execution
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Retrieve one durable archive operation
      security: [{ArchiveUserToken: []}]
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
  /api/archive/operations/{operationId}/companion-session:
    parameters: [{$ref: '#/components/parameters/OperationId'}]
    post:
      operationId: createArchiveCompanionSession
      x-semantic-operation: execution
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Create a scoped Companion capability for a mixed archive operation
      security: [{ArchiveUserToken: []}]
      responses:
        '200':
          description: Scoped Companion capability
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArchiveCompanionSession'}
  /api/archive/operations/{operationId}/phase:
    parameters: [{$ref: '#/components/parameters/OperationId'}]
    post:
      operationId: transitionArchiveOperation
      x-semantic-operation: execution
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Transition a durable archive operation phase
      security: [{ArchiveUserToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchiveOperationTransition'}
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
        '409': {$ref: '#/components/responses/StaleRevision'}
  /api/archive/operations/{operationId}/execute-create:
    parameters: [{$ref: '#/components/parameters/OperationId'}]
    post:
      operationId: executeArchiveCreation
      x-semantic-operation: creation
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Execute a same-SMB archive creation operation
      security: [{ArchiveUserToken: []}]
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
  /api/archive/operations/{operationId}/execute-extract:
    parameters: [{$ref: '#/components/parameters/OperationId'}]
    post:
      operationId: executeArchiveExtraction
      x-semantic-operation: extraction
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Execute a same-SMB archive extraction operation
      security: [{ArchiveUserToken: []}]
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
  /api/archive/operations/{operationId}/decide-extraction:
    parameters: [{$ref: '#/components/parameters/OperationId'}]
    post:
      operationId: decideArchiveExtraction
      x-semantic-operation: extraction
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Apply a collision, retry, ignore, or cancellation decision to an extraction operation
      security: [{ArchiveUserToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchiveExtractionDecision'}
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
        '409': {$ref: '#/components/responses/StaleRevision'}
  /api/archive/operations/{operationId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OperationId'
      - $ref: '#/components/parameters/ExpectedRevision'
    post:
      operationId: cancelArchiveOperation
      x-semantic-operation: execution
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Request cancellation of a durable archive operation
      security: [{ArchiveUserToken: []}]
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
        '409': {$ref: '#/components/responses/StaleRevision'}
  /api/archive/operations/{operationId}/companion-relay/local_zip_to_smb_extract/begin:
    post:
      operationId: beginLocalZipToSmbExtractionRelay
      x-semantic-operation: extraction
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Begin a scoped local ZIP to SMB extraction relay
      security: [{ArchiveOperationToken: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchiveExtractionSourceManifest'}
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
        '409': {$ref: '#/components/responses/RelayConflict'}
  /api/archive/operations/{operationId}/companion-relay/local_zip_to_smb_extract/member:
    put:
      operationId: writeLocalZipToSmbExtractionMember
      x-semantic-operation: extraction
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Write one decoded local ZIP member to its scoped SMB destination
      security: [{ArchiveOperationToken: []}]
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/MemberPath'
        - $ref: '#/components/parameters/IsDirectory'
        - $ref: '#/components/parameters/SourceModifiedAt'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {$ref: '#/components/schemas/ArchiveBinaryStream'}
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
        '409': {$ref: '#/components/responses/RelayConflict'}
  /api/archive/operations/{operationId}/companion-relay/local_zip_to_smb_extract/complete:
    post:
      operationId: completeLocalZipToSmbExtractionRelay
      x-semantic-operation: extraction
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Complete a scoped local ZIP to SMB extraction relay
      security: [{ArchiveOperationToken: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
        '409': {$ref: '#/components/responses/RelayConflict'}
  /api/archive/operations/{operationId}/companion-relay/local_zip_to_smb_extract/fail:
    post:
      operationId: failLocalZipToSmbExtractionRelay
      x-semantic-operation: extraction
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Fail a scoped local ZIP to SMB extraction relay
      security: [{ArchiveOperationToken: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchiveFailure'}
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
  /api/archive/operations/{operationId}/companion-relay/smb_zip_to_local_extract/begin:
    post:
      operationId: beginSmbZipToLocalExtractionRelay
      x-semantic-operation: extraction
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Begin a scoped SMB ZIP to local extraction relay
      security: [{ArchiveOperationToken: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      responses:
        '200':
          description: Validated SMB ZIP member manifest
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArchiveExtractionManifest'}
        '409': {$ref: '#/components/responses/RelayConflict'}
  /api/archive/operations/{operationId}/companion-relay/smb_zip_to_local_extract/member:
    get:
      operationId: readSmbZipToLocalExtractionMember
      x-semantic-operation: extraction
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Read one decoded member from a scoped SMB ZIP source
      security: [{ArchiveOperationToken: []}]
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/MemberPath'
      responses:
        '200':
          description: Decoded archive member bytes
          content:
            application/octet-stream:
              schema: {$ref: '#/components/schemas/ArchiveBinaryStream'}
        '409': {$ref: '#/components/responses/RelayConflict'}
  /api/archive/operations/{operationId}/companion-relay/smb_zip_to_local_extract/member-complete:
    post:
      operationId: completeSmbZipToLocalExtractionMember
      x-semantic-operation: extraction
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Record one completed local extraction member
      security: [{ArchiveOperationToken: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchiveExtractionMemberCompletion'}
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
        '409': {$ref: '#/components/responses/RelayConflict'}
  /api/archive/operations/{operationId}/companion-relay/smb_zip_to_local_extract/member-collision:
    post:
      operationId: reportSmbZipToLocalExtractionCollision
      x-semantic-operation: extraction
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Pause for a local extraction collision decision
      security: [{ArchiveOperationToken: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchiveExtractionCollision'}
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
        '409': {$ref: '#/components/responses/RelayConflict'}
  /api/archive/operations/{operationId}/companion-relay/smb_zip_to_local_extract/member-error:
    post:
      operationId: reportSmbZipToLocalExtractionMemberError
      x-semantic-operation: extraction
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Pause for a local extraction member error decision
      security: [{ArchiveOperationToken: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchiveExtractionMemberError'}
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
        '409': {$ref: '#/components/responses/RelayConflict'}
  /api/archive/operations/{operationId}/companion-relay/smb_zip_to_local_extract/complete:
    post:
      operationId: completeSmbZipToLocalExtractionRelay
      x-semantic-operation: extraction
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Complete a scoped SMB ZIP to local extraction relay
      security: [{ArchiveOperationToken: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchiveExtractionSummary'}
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
        '409': {$ref: '#/components/responses/RelayConflict'}
  /api/archive/operations/{operationId}/companion-relay/smb_zip_to_local_extract/fail:
    post:
      operationId: failSmbZipToLocalExtractionRelay
      x-semantic-operation: extraction
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Fail a scoped SMB ZIP to local extraction relay
      security: [{ArchiveOperationToken: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchiveFailure'}
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
  /api/archive/operations/{operationId}/companion-relay/smb_to_local_zip_create/begin:
    post:
      operationId: beginSmbToLocalZipCreationRelay
      x-semantic-operation: creation
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Begin a scoped SMB to local ZIP creation relay
      security: [{ArchiveOperationToken: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      responses:
        '200':
          description: Validated SMB source manifest
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArchiveCreationManifest'}
        '409': {$ref: '#/components/responses/RelayConflict'}
  /api/archive/operations/{operationId}/companion-relay/smb_to_local_zip_create/member:
    get:
      operationId: readSmbToLocalZipCreationMember
      x-semantic-operation: creation
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Read one approved SMB file for local ZIP creation
      security: [{ArchiveOperationToken: []}]
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/ArchivePath'
      responses:
        '200':
          description: Source file bytes
          content:
            application/octet-stream:
              schema: {$ref: '#/components/schemas/ArchiveBinaryStream'}
        '409': {$ref: '#/components/responses/RelayConflict'}
  /api/archive/operations/{operationId}/companion-relay/smb_to_local_zip_create/member-complete:
    post:
      operationId: completeSmbToLocalZipCreationMember
      x-semantic-operation: creation
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Record one committed local ZIP member
      security: [{ArchiveOperationToken: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchiveCreationMemberCompletion'}
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
        '409': {$ref: '#/components/responses/RelayConflict'}
  /api/archive/operations/{operationId}/companion-relay/smb_to_local_zip_create/complete:
    post:
      operationId: completeSmbToLocalZipCreationRelay
      x-semantic-operation: creation
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Complete a scoped SMB to local ZIP creation relay
      security: [{ArchiveOperationToken: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchiveCreationSummary'}
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
        '409': {$ref: '#/components/responses/RelayConflict'}
  /api/archive/operations/{operationId}/companion-relay/smb_to_local_zip_create/fail:
    post:
      operationId: failSmbToLocalZipCreationRelay
      x-semantic-operation: creation
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Fail a scoped SMB to local ZIP creation relay
      security: [{ArchiveOperationToken: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchiveFailure'}
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
  /api/archive/operations/{operationId}/companion-relay/local_to_smb_zip_create/begin:
    post:
      operationId: beginLocalToSmbZipCreationRelay
      x-semantic-operation: creation
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Begin a scoped local to SMB ZIP creation relay with its local source manifest
      security: [{ArchiveOperationToken: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchiveCreationSourceManifest'}
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
        '409': {$ref: '#/components/responses/RelayConflict'}
  /api/archive/operations/{operationId}/companion-relay/local_to_smb_zip_create/member:
    put:
      operationId: writeLocalToSmbZipCreationMember
      x-semantic-operation: creation
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Commit one approved local source member to the scoped SMB ZIP
      security: [{ArchiveOperationToken: []}]
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/ArchivePath'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {$ref: '#/components/schemas/ArchiveBinaryStream'}
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
        '409': {$ref: '#/components/responses/RelayConflict'}
  /api/archive/operations/{operationId}/companion-relay/local_to_smb_zip_create/complete:
    post:
      operationId: completeLocalToSmbZipCreationRelay
      x-semantic-operation: creation
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Complete a scoped local to SMB ZIP creation relay
      security: [{ArchiveOperationToken: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchiveCreationSummary'}
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
        '409': {$ref: '#/components/responses/RelayConflict'}
  /api/archive/operations/{operationId}/companion-relay/local_to_smb_zip_create/fail:
    post:
      operationId: failLocalToSmbZipCreationRelay
      x-semantic-operation: creation
      x-retirement-condition: Remove after V2 caller migration and the historical V1 operation-retention window.
      summary: Fail a scoped local to SMB ZIP creation relay
      security: [{ArchiveOperationToken: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchiveFailure'}
      responses:
        '200': {$ref: '#/components/responses/ArchiveOperation'}
components:
  parameters:
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberPath:
      name: member_path
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    ArchivePath:
      name: archive_path
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    IsDirectory:
      name: is_directory
      in: query
      required: false
      schema:
        type: boolean
        default: false
    SourceModifiedAt:
      name: source_modified_at
      in: query
      required: false
      schema:
        type: string
        format: date-time
    ExpectedRevision:
      name: expected_revision
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
  securitySchemes:
    ArchiveUserToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ArchiveOperationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    StaleRevision:
      description: The execution changed before the mutation could be applied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ArchiveContractError'
    RelayConflict:
      description: The scoped operation is not in a state that permits this relay action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ArchiveContractError'
    ArchiveOperation:
      description: Current durable operation state after a scoped relay action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ArchiveOperationRead'
  schemas:
    ArchiveBinaryStream:
      type: string
