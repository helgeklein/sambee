        member_path: {type: string, minLength: 1}
        status: {type: string, enum: [directory, extracted, skipped, ignored]}
        target_path: {type: string, minLength: 1}
        directories_created: {type: integer, minimum: 0}
        extracted_bytes: {type: integer, minimum: 0}
        replaced: {type: boolean}
        renamed: {type: boolean}
    ArchiveExtractionMemberResultV1:
