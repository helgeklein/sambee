        size: {type: integer, minimum: 0}
        compressed_size: {type: integer, minimum: 0}
        compression_method: {type: integer, minimum: 0}
        crc32: {type: integer, minimum: 0}
        modified_at: {type: string, format: date-time}
        state: {type: string, enum: [readable, blocked, unavailable]}
        is_hidden: {type: boolean}
    ArchiveExtractionManifest:
      type: object
      additionalProperties: false
