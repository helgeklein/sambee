      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [create, extract]}
        phase: {type: string, enum: [prepared, accepted, streaming, awaiting_user_decision, verifying, completed, cancelled, failed]}
        source_connection_id: {type: string}
        source_path: {type: string}
        destination_connection_id: {type: string}
        destination_path: {type: string}
        manifest_hash: {type: string}
        revision: {type: integer, minimum: 0}
        checkpoint_json: {type: string}
        pending_decision_json: {type: [string, 'null']}
        collision_policy: {type: [string, 'null']}
        cancellation_requested: {type: boolean}
        last_error_json: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        heartbeat_at: {type: string, format: date-time}
    ArchiveOperationPrepare:
      type: object
      additionalProperties: false
      required: [kind, source_connection_id, source_path, destination_connection_id, destination_path]
      properties:
        kind: {type: string, enum: [create, extract]}
        source_connection_id: {type: string}
        source_path: {type: string}
        destination_connection_id: {type: string}
        destination_path: {type: string}
        manifest_hash: {type: string, default: ''}
        plan_json: {type: string, default: '{}'}
    ArchiveOperationTransition:
      type: object
      additionalProperties: false
      required: [expected_phase, next_phase]
      properties:
        expected_phase:
          type: string
          enum: [prepared, accepted, streaming, awaiting_user_decision, verifying, completed, cancelled, failed]
        next_phase:
          type: string
          enum: [prepared, accepted, streaming, awaiting_user_decision, verifying, completed, cancelled, failed]
        expected_revision: {type: [integer, 'null'], minimum: 0}
    ArchiveExtractionDecision:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [skip, skip_all, replace, replace_all, replace_older, rename, retry, ignore, cancel]
        member_path: {type: [string, 'null']}
        target_path: {type: [string, 'null']}
        expected_revision: {type: [integer, 'null'], minimum: 0}
    ArchiveCompanionSession:
      type: object
      additionalProperties: false
      required: [token, expires_in, operation]
      properties:
