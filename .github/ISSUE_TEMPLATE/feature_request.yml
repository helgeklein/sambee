name: Feature request
description: Propose a new capability or improvement for Sambee.
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this form for new capabilities, improvements, or meaningful UX changes.

        Strong requests describe the user problem first, then the desired outcome.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched for existing feature requests before filing this issue.
          required: true
        - label: This request describes a concrete problem or workflow gap, not only a solution idea.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Main area
      options:
        - Frontend web app
        - Backend API or SMB access
        - Companion app
        - Website or docs
        - CI, build, or developer tooling
        - Cross-cutting or multiple areas
        - Unsure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the current limitation, pain point, or missing workflow.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result you want, independent of implementation details where possible.
    validations:
      required: true

  - type: textarea
    id: users
    attributes:
      label: Who benefits and why
      description: Explain the user, operator, or developer impact.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds considered
      description: Include current workarounds or competing approaches.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Add mockups, related issues, prior discussion, or technical constraints.
    validations:
      required: false
