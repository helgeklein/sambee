name: Bug report
description: Report broken behavior in Sambee.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this form for defects in Sambee.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched for existing issues before filing this report.
          required: true
        - label: I reviewed relevant docs or troubleshooting guidance.
          required: true
        - label: I can reproduce this issue, or I'll explain why I cannot.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the bug in detail.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the steps to reproduce the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what actually happens.
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Regression?
      description: Did this work in an earlier version or environment?
      options:
        - Yes, it worked before
        - No, it never worked for me
        - Unsure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Sambee version
      description: Sambee version (e.g., 1.0.33), to be found in Settings > About.
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS type and version
      description: OS of the machine on which you're running the browser from which you're accessing Sambee.
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser type and version
      description: Browser and its version you're using to access Sambee.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Logs, diagnostics, screenshots, or console output
      description: Paste relevant log lines, browser console errors, backend logs, or companion logs. Redact secrets.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other details, links to related issues, or failed workarounds.
    validations:
      required: false
