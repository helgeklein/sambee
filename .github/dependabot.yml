version: 2
multi-ecosystem-groups:
  companion-tauri:
    commit-message:
      prefix: "deps(companion)"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - companion
      - rust

updates:
  - package-ecosystem: github-actions
    directory: "/"
    commit-message:
      prefix: "deps(ci)"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: "/.github/tools/crane"
    commit-message:
      prefix: "deps(ci)"
    schedule:
      interval: weekly
      day: monday
      time: "05:05"
      timezone: UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
      - go
    groups:
      ci-go-tools:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/backend"
    commit-message:
      prefix: "deps(pip)"
      prefix-development: "deps-dev(pip)"
    schedule:
      interval: weekly
      day: monday
      time: "05:10"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    ignore:
      # pydantic-core is a transitive dependency pinned exactly by the direct
      # pydantic requirement. Dependabot lockfile-only bumps here can become
      # impossible to install under --require-hashes until a newer pydantic
      # release adopts that core version.
      - dependency-name: "pydantic-core"
    groups:
      backend-python-dev-tools:
        patterns:
          - "black"
          - "faker"
          - "httpx"
          - "ipython"
          - "mypy"
          - "pytest"
          - "pytest-*"
          - "rich"
          - "ruff"
      backend-python-smbprotocol:
        patterns:
          - "smbprotocol"
      backend-python-pyvips:
        patterns:
          - "pyvips"
      backend-python-runtime:
        patterns:
          - "*"
        exclude-patterns:
          - "black"
          - "faker"
          - "httpx"
          - "ipython"
          - "mypy"
          - "pyvips"
          - "pytest"
          - "pytest-*"
          - "rich"
          - "ruff"
          - "smbprotocol"

  - package-ecosystem: npm
    directory: "/frontend"
    commit-message:
      prefix: "deps(npm)"
      prefix-development: "deps-dev(npm)"
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      frontend-npm:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/companion"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: UTC
    labels:
      - dependencies
      - companion
    patterns:
      - "@tauri-apps/*"
    multi-ecosystem-group: companion-tauri
    groups:
      companion-npm:
        patterns:
          - "*"
        exclude-patterns:
          - "@tauri-apps/*"

  - package-ecosystem: cargo
    directory: "/companion/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "05:40"
      timezone: UTC
    labels:
      - dependencies
      - rust
    patterns:
      - "tauri"
      - "tauri-*"
    multi-ecosystem-group: companion-tauri
    groups:
      companion-rust:
        patterns:
          - "*"
        exclude-patterns:
          - "tauri"
          - "tauri-*"

  - package-ecosystem: docker
    directory: "/"
    commit-message:
      prefix: "deps(docker)"
    schedule:
      interval: weekly
      day: monday
      time: "05:50"
      timezone: UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    ignore:
      # Node upgrades affect both frontend and companion toolchains and remain
      # coordinated manually. Python is the shared runtime-base input and is
      # validated by the Docker target checks in CI.
      - dependency-name: "node"
    groups:
      root-docker:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/tools/trivy"
    commit-message:
      prefix: "deps(ci)"
    schedule:
      interval: weekly
      day: monday
      time: "05:55"
      timezone: UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
      - docker
    groups:
      ci-docker-tools:
        patterns:
          - "*"

