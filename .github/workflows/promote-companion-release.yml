name: "Release: Promote Companion Release"

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Companion release tag, GitHub release URL, or numeric GitHub release ID
        required: true
        type: string
      companion_channel_test:
        description: Update Companion test channel feed
        required: true
        type: boolean
        default: false
      companion_channel_beta:
        description: Update Companion beta channel feed
        required: true
        type: boolean
        default: false
      companion_channel_stable:
        description: Update Companion stable channel feed
        required: true
        type: boolean
        default: false
      sambee:
        description: Update Sambee Companion feed
        required: true
        type: boolean
        default: false

env:
  COMPANION_RELEASE_REPO_OWNER: helgeklein
  COMPANION_RELEASE_REPO_NAME: sambee-companion
  COMPANION_RELEASE_REPO_BRANCH: main

concurrency:
  group: companion-release-publication
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Validate selection
        run: |
          if [[ "${{ github.event.inputs.companion_channel_test }}" != "true" && \
                "${{ github.event.inputs.companion_channel_beta }}" != "true" && \
                "${{ github.event.inputs.companion_channel_stable }}" != "true" && \
                "${{ github.event.inputs.sambee }}" != "true" ]]; then
            echo "At least one promotion target must be selected." >&2
            exit 1
          fi

      - name: Checkout sambee
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Companion release
        id: resolve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.COMPANION_RELEASE_REPO_TOKEN }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          resolved_release="$(python3 .github/scripts/promote_companion_release.py \
            --resolve-release \
            --release-ref "$RELEASE_REF" \
            --release-owner "${{ env.COMPANION_RELEASE_REPO_OWNER }}" \
            --release-repo "${{ env.COMPANION_RELEASE_REPO_NAME }}")"
          release_id="$(jq -er '.release_id | if type == "number" and . > 0 and floor == . then . else error("invalid release ID") end' <<<"$resolved_release")"
          release_tag="$(jq -er '.release_tag | strings' <<<"$resolved_release")"
          build_tag="$(jq -er '.build_tag | strings' <<<"$resolved_release")"
          source_sha="$(jq -er '.source_sha | strings' <<<"$resolved_release")"
          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'build_tag=%s\n' "$build_tag" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Validate Companion provenance
        id: provenance
        shell: bash
        env:
          BUILD_TAG: ${{ steps.resolve.outputs.build_tag }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
        run: |
          git fetch origin "refs/tags/$BUILD_TAG:refs/tags/$BUILD_TAG"
          if [[ "$(git rev-parse "refs/tags/$BUILD_TAG^{commit}")" != "$SOURCE_SHA" ]]; then
            echo "Companion provenance source SHA does not match canonical tag $BUILD_TAG." >&2
            exit 1
          fi
          printf 'build_tag=%s\n' "$BUILD_TAG" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout release repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.COMPANION_RELEASE_REPO_OWNER }}/${{ env.COMPANION_RELEASE_REPO_NAME }}
          ref: ${{ env.COMPANION_RELEASE_REPO_BRANCH }}
          token: ${{ secrets.COMPANION_RELEASE_REPO_TOKEN }}
          path: release-repo

      - name: Generate feed files
        env:
          GITHUB_TOKEN: ${{ secrets.COMPANION_RELEASE_REPO_TOKEN }}
          RELEASE_ID: ${{ steps.resolve.outputs.release_id }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          args=()
          if [[ "${{ github.event.inputs.companion_channel_test }}" == "true" ]]; then
            args+=(--companion-channel-test)
          fi
          if [[ "${{ github.event.inputs.companion_channel_beta }}" == "true" ]]; then
            args+=(--companion-channel-beta)
          fi
          if [[ "${{ github.event.inputs.companion_channel_stable }}" == "true" ]]; then
            args+=(--companion-channel-stable)
          fi
          if [[ "${{ github.event.inputs.sambee }}" == "true" ]]; then
            args+=(--sambee)
          fi

          python3 .github/scripts/promote_companion_release.py \
            --release-ref "$RELEASE_ID" \
            --release-owner "${{ env.COMPANION_RELEASE_REPO_OWNER }}" \
            --release-repo "${{ env.COMPANION_RELEASE_REPO_NAME }}" \
            --release-repo-path "$PWD/release-repo" \
            --expected-release-id "$RELEASE_ID" \
            --expected-release-tag "$RELEASE_TAG" \
            "${args[@]}"

      - name: Commit and push feed updates
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          git -C release-repo config user.name "github-actions[bot]"
          git -C release-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C release-repo add docs/feeds

          if git -C release-repo diff --cached --quiet; then
            echo "No feed changes to commit."
            exit 0
          fi

          git -C release-repo commit -m "Promote ${RELEASE_TAG} release feeds"
          if ! git -C release-repo push origin HEAD:${{ env.COMPANION_RELEASE_REPO_BRANCH }}; then
            targets=()
            [[ "${{ github.event.inputs.companion_channel_test }}" == "true" ]] && targets+=("Companion test feed")
            [[ "${{ github.event.inputs.companion_channel_beta }}" == "true" ]] && targets+=("Companion beta feed")
            [[ "${{ github.event.inputs.companion_channel_stable }}" == "true" ]] && targets+=("Companion stable feed")
            [[ "${{ github.event.inputs.sambee }}" == "true" ]] && targets+=("Sambee Companion metadata")
            echo "Failed to push feed updates for: ${targets[*]}. The remote feed state is unknown; inspect those targets before retrying." >&2
            exit 1
          fi
