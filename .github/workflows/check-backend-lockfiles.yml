name: "CI: Check Backend Lockfiles"

on:
  push:
    branches: [ main ]
    paths:
      - backend/requirements.txt
      - backend/requirements-dev.txt
      - backend/requirements.lock.txt
      - backend/requirements-dev.lock.txt
      - scripts/verify-backend-lockfiles.py
  pull_request:
    branches: [ main ]
    paths:
      - backend/requirements.txt
      - backend/requirements-dev.txt
      - backend/requirements.lock.txt
      - backend/requirements-dev.lock.txt
        - scripts/verify-backend-lockfiles.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate backend lockfiles
        run: python3 scripts/verify-backend-lockfiles.py
