name: Format Dependabot PR Title

on:
  workflow_run:
    workflows: ["CI: Test"]
    types: [requested, completed]
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  format-title:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Prefix title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const groupPrefixes = [
              [/backend-python-dev-tools group\b/, "deps-dev(pip)"],
              [/ci-docker-tools group\b/, "deps(ci)"],
              [/companion-tauri group\b/, "deps(companion)"],
            ];
            const prefixes = [
              [/^dependabot\/(?:github_actions|gomod)\//, "deps(ci)"],
              [/^dependabot\/pip\/backend\/backend-python-dev-tools-/, "deps-dev(pip)"],
              [/^dependabot\/pip\//, "deps(pip)"],
              [/^dependabot\/(?:npm|npm_and_yarn)\//, "deps(npm)"],
              [/^dependabot\/cargo\//, "deps(cargo)"],
              [/^dependabot\/docker\/\.github\/tools\/trivy\//, "deps(ci)"],
              [/^dependabot\/docker\//, "deps(docker)"],
              [/^dependabot\/multi-ecosystem\/companion-tauri(?:-|\/)/, "deps(companion)"],
            ];
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            for (const pullRequest of pullRequests) {
              if (pullRequest.user?.login !== "dependabot[bot]" || pullRequest.base.ref !== "main") {
                continue;
              }
              const branch = pullRequest.head.ref;
              const title = pullRequest.title;
              const prefix =
                groupPrefixes.find(([pattern]) => pattern.test(title))?.[1] ??
                prefixes.find(([pattern]) => pattern.test(branch))?.[1];
              if (!prefix) {
                core.warning(`No title prefix configured for Dependabot branch: ${branch}`);
                continue;
              }
              if (title.startsWith(`${prefix}: `)) {
                continue;
              }
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequest.number,
                title: `${prefix}: ${title}`,
              });
            }
